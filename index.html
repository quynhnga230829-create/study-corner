<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6c5d8">
<title>Study Corner ♡</title>
<style>
:root{--pink:#e99ab8;--pink2:#f8dce7;--pale:#fff5f8;--cream:#fffaf6;--ink:#624653;--muted:#9a7d89;--line:#f1dce5;--white:#fff;--green:#82aa91;--shadow:0 8px 25px #b77b9417}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7fa,#fffaf5);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1200px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:var(--pink2);display:grid;place-items:center;font-size:25px}.brand h1{font-size:23px;margin:0;color:#a95578}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.date-pill{background:white;border:1px solid var(--line);padding:10px 14px;border-radius:20px;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:225px 1fr;gap:18px}.side,.panel,.card{background:#ffffffd9;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.side{padding:13px;height:max-content;position:sticky;top:12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;text-align:left;color:var(--muted);padding:12px;border-radius:12px;font-size:14px}.nav button.active,.nav button:hover{background:var(--pale);color:#a95578;font-weight:700}.nav small{display:block;padding:13px 10px 5px;color:#c49aaa;font-size:10px;text-transform:uppercase;letter-spacing:1.2px}.content{min-width:0}.welcome{background:linear-gradient(110deg,#f9dce7,#fff0f4 65%,#fff9f3);border-radius:22px;padding:24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.welcome h2{margin:0 0 7px;font-size:25px;color:#a95578}.welcome p{margin:0;color:#946f7e;font-size:14px}.welcome .flower{font-size:48px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}.section-head h2{margin:0;font-size:20px;color:#9f5676}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:16px;min-width:0}.stat{display:flex;align-items:center;gap:12px}.stat-icon{width:42px;height:42px;border-radius:14px;background:var(--pale);display:grid;place-items:center;font-size:21px}.stat strong{font-size:22px;color:#a95578;display:block}.stat span{font-size:12px;color:var(--muted)}.btn{background:#e99ab8;color:white;padding:10px 14px;border-radius:12px;font-weight:650;font-size:13px}.btn.secondary{background:var(--pale);color:#a95578;border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#b65c65}.btn.tiny{padding:6px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{display:flex;flex-direction:column;gap:9px}.item{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item h3{margin:0 0 4px;font-size:14px}.item p{margin:0;color:var(--muted);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-block;background:var(--pale);color:#a95578;border-radius:20px;padding:4px 8px;font-size:11px;margin:2px}.empty{text-align:center;color:#b18d9b;padding:25px 10px;font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#946f7e;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--pink)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.form-grid .full{grid-column:1/-1}.table-wrap{overflow-x:auto}.timetable{width:100%;border-collapse:collapse;min-width:600px;font-size:12px}.timetable th,.timetable td{border:1px solid var(--line);padding:9px;text-align:center}.timetable th{background:var(--pale);color:#a95578}.timetable td{background:white;min-width:78px}.timetable td button{background:transparent;color:#a95578;font-size:11px}.progress{height:9px;border-radius:10px;background:#f8e8ee;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#e99ab8,#f4c2d4);border-radius:10px}.timer{text-align:center;padding:18px}.timer-display{font-size:58px;font-weight:750;color:#b15d80;letter-spacing:2px;margin:12px}.timer-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.score{font-size:23px;color:#a95578;font-weight:750}.footer{text-align:center;color:#c49aaa;font-size:11px;padding:25px 0 10px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#51344455;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:#fffafd;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #59324733}.modal h3{margin:0 0 16px;color:#a95578}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#68495a;color:white;padding:11px 17px;border-radius:30px;font-size:13px;z-index:20;box-shadow:var(--shadow)}
@media(max-width:760px){.app{padding:12px}.layout{grid-template-columns:1fr}.side{position:static;padding:8px;overflow:auto}.nav{flex-direction:row;width:max-content}.nav button{padding:9px 12px;white-space:nowrap}.nav small{display:none}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome{padding:18px}.welcome h2{font-size:21px}.date-pill{display:none}}
@media(max-width:430px){.grid,.grid.three{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.brand h1{font-size:20px}.welcome .flower{font-size:35px}.timer-display{font-size:48px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">🌷</div><div><h1>Study Corner</h1><p>Your little study space ♡</p></div></div>
 <div class="date-pill" id="todayLabel"></div>
</header>
<div class="layout">
<aside class="side"><nav class="nav" id="nav">
 <small>Không gian học tập</small>
 <button class="active" data-page="home">🏡 Tổng quan</button>
 <button data-page="timetable">📅 Thời khóa biểu</button>
 <button data-page="notes">📝 Ghi chú</button>
 <button data-page="tasks">📚 Bài tập</button>
 <button data-page="exams">⏰ Lịch kiểm tra</button>
 <button data-page="pomodoro">🍅 Pomodoro</button>
 <button data-page="goals">🌱 Mục tiêu</button>
 <button data-page="resources">📎 Tài liệu</button>
 <button data-page="grades">💗 Tính điểm</button>
</nav></aside>
<main class="content" id="main"></main>
</div>
<div class="footer">Made with love ♡ Study a little, grow a lot.</div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='studyCorner_v1';
const defaults={timetable:[],notes:[],tasks:[],exams:[],goals:[],resources:[],grades:[]};
let db=load(),page='home',timer=null,remaining=25*60,mode='study';
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',2200)}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return '';return new Date(d+'T00:00:00').toLocaleDateString('vi-VN')}
function empty(s){return `<div class="empty">🌸 ${s}</div>`}
function btn(label,fn,cls='secondary'){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function actions(type,id){return `<div class="actions">${btn('Sửa',`editItem('${type}','${id}')`,'tiny secondary')}${btn('Xóa',`deleteItem('${type}','${id}')`,'tiny danger')}</div>`}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${title}</h3>${body}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function area(label,name,value=''){return `<div class="field full"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`}
function select(label,name,opts,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function formModal(title,fields,onSave,old={}){openModal(title,`<form id="editForm"><div class="form-grid">${fields(old)}</div><div class="actions">${btn('Lưu lại','', 'primary').replace('<button','<button type="submit"').replace('onclick=""','') }<button type="button" class="btn secondary" onclick="closeModal()">Hủy</button></div></form>`);document.getElementById('editForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());onSave(data);closeModal();render();toast('Đã lưu thay đổi ♡')}}
function add(type){editItem(type,null)}
function editItem(type,itemId){const old=itemId?db[type].find(x=>x.id===itemId)||{}:{};const days=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];const subjects=['Toán','Ngữ văn','Tiếng Anh','Vật lý','Hóa học','Sinh học','Lịch sử','Địa lý','Tin học','Khác'];
let fields,saveFn;
if(type==='timetable'){fields=o=>`${select('Thứ','day',days,o.day||'Thứ 2')}${field('Tiết / giờ','time',o.time||'')}${select('Môn học','subject',subjects,o.subject||'Toán')}${field('Phòng / ghi chú','detail',o.detail||'')}`;saveFn=d=>upsert(type,{...d,id:old.id||id()})}
if(type==='notes'){fields=o=>`${select('Môn học','subject',subjects,o.subject||'Toán')}${field('Tiêu đề','title',o.title||'')}${area('Nội dung ghi chú','body',o.body||'')}`;saveFn=d=>upsert(type,{...d,id:old.id||id(),updated:today()})}
if(type==='tasks'){fields=o=>`${field('Tên bài tập','title',o.title||'')}${select('Môn học','subject',subjects,o.subject||'Toán')}${field('Hạn hoàn thành','due',o.due||today(),'date')}${select('Trạng thái','status',['Chưa làm','Đang làm','Hoàn thành'],o.status||'Chưa làm')}${area('Mô tả','detail',o.detail||'')}`;saveFn=d=>upsert(type,{...d,id:old.id||id()})}
if(type==='exams'){fields=o=>`${field('Tên bài kiểm tra','title',o.title||'')}${select('Môn học','subject',subjects,o.subject||'Toán')}${field('Ngày kiểm tra','date',o.date||today(),'date')}${field('Giờ kiểm tra','time',o.time||'','time')}${area('Nội dung cần ôn','detail',o.detail||'')}`;saveFn=d=>upsert(type,{...d,id:old.id||id()})}
if(type==='goals'){fields=o=>`${field('Mục tiêu','title',o.title||'')}${field('Việc cần làm / số buổi','target',o.target||'')}${field('Đã hoàn thành','done',o.done||'0','number','min="0"')}${field('Ngày cần đạt','due',o.due||today(),'date')}`;saveFn=d=>upsert(type,{...d,id:old.id||id()})}
if(type==='resources'){fields=o=>`${field('Tên tài liệu','title',o.title||'')}${select('Môn học','subject',subjects,o.subject||'Toán')}${field('Đường link tài liệu','url',o.url||'','url')}${area('Mô tả','detail',o.detail||'')}`;saveFn=d=>upsert(type,{...d,id:old.id||id()})}
if(type==='grades'){fields=o=>`${select('Môn học','subject',subjects,o.subject||'Toán')}${field('Tên cột điểm','label',o.label||'Ví dụ: giữa kỳ')}${field('Điểm','score',o.score??'','number','min="0" max="10" step="0.1" required')}${field('Hệ số','weight',o.weight||'1','number','min="1" max="3" required')}`;saveFn=d=>upsert(type,{...d,score:Number(d.score),weight:Number(d.weight),id:old.id||id()})}
formModal((old.id?'Sửa ':'Thêm ')+({timetable:'lịch học',notes:'ghi chú',tasks:'bài tập',exams:'lịch kiểm tra',goals:'mục tiêu',resources:'tài liệu',grades:'điểm số'}[type]),fields,saveFn,old)}
function upsert(type,obj){const i=db[type].findIndex(x=>x.id===obj.id);if(i<0)db[type].unshift(obj);else db[type][i]=obj;save()}
function deleteItem(type,itemId){if(!confirm('Bạn chắc chắn muốn xóa mục này?'))return;db[type]=db[type].filter(x=>x.id!==itemId);save();render();toast('Đã xóa')}
function toggleTask(itemId){const x=db.tasks.find(x=>x.id===itemId);if(x){x.status=x.status==='Hoàn thành'?'Chưa làm':'Hoàn thành';save();render()}}
function card(title,content,extra=''){return `<section class="card"><div class="section-head"><h2>${title}</h2>${extra}</div>${content}</section>`}
function render(){document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'});document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const root=document.getElementById('main');root.innerHTML=page==='home'?home():({timetable:timetable,notes:notes,tasks:tasks,exams:exams,pomodoro:pomodoro,goals:goals,resources:resources,grades:grades}[page])()}
function home(){const pending=db.tasks.filter(x=>x.status!=='Hoàn thành').length,done=db.tasks.length-pending,upcoming=db.exams.filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return `<div class="welcome"><div><h2>Chào bạn, hôm nay học tốt nhé! ♡</h2><p>Mỗi bước nhỏ đều đưa bạn đến gần mục tiêu hơn.</p></div><div class="flower">🌸</div></div><div class="grid three"><div class="card stat"><div class="stat-icon">📚</div><div><strong>${pending}</strong><span>Bài tập cần làm</span></div></div><div class="card stat"><div class="stat-icon">🌷</div><div><strong>${done}</strong><span>Bài đã hoàn thành</span></div></div><div class="card stat"><div class="stat-icon">📝</div><div><strong>${db.notes.length}</strong><span>Ghi chú đã lưu</span></div></div></div><div style="height:14px"></div><div class="grid">${card('✨ Việc cần làm',db.tasks.filter(x=>x.status!=='Hoàn thành').slice(0,4).map(x=>`<div class="item"><div><h3>${esc(x.title)}</h3><p>${esc(x.subject)} · Hạn ${fmt(x.due)}</p></div>${btn('Xong',`toggleTask('${x.id}')`,'tiny')}</div>`).join('')||empty('Chưa có bài tập nào!'),btn('+ Thêm',`add('tasks')'))}${card('⏰ Kiểm tra sắp tới',upcoming.map(x=>`<div class="item"><div><h3>${esc(x.title)}</h3><p>${esc(x.subject)} · ${fmt(x.date)}</p></div><span class="tag">${Math.ceil((new Date(x.date)-new Date(today()))/86400000)} ngày</span></div>`).join('')||empty('Chưa có lịch kiểm tra.'),btn('+ Thêm',`add('exams')`))}${card('🌱 Mục tiêu học tập',db.goals.slice(0,3).map(g=>{let p=Math.min(100,Math.round((Number(g.done)||0)/(Number(g.target)||1)*100));return `<div style="margin-bottom:12px"><b>${esc(g.title)}</b><div class="progress"><span style="width:${p}%"></span></div><p class="muted">${g.done||0}/${g.target||1} · ${p}%</p></div>`}).join('')||empty('Thêm mục tiêu đầu tiên nhé!'),btn('+ Thêm',`add('goals')`))}${card('💌 Lời nhắn nhỏ',`<p class="muted">“Đừng cần hoàn hảo, chỉ cần tiến bộ hơn hôm qua một chút.”</p><p style="color:#c17a98">You can do it! ♡</p>`)}</div>`}
function timetable(){const days=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];return `<div class="section-head"><div><h2>📅 Thời khóa biểu</h2><p class="muted">Sắp xếp lịch học trong tuần của bạn.</p></div>${btn('+ Thêm tiết học',`add('timetable')`)}</div>${card('Lịch học tuần',`<div class="table-wrap"><table class="timetable"><thead><tr><th>Thứ</th><th>Tiết / giờ</th><th>Môn học</th><th>Ghi chú</th><th></th></tr></thead><tbody>${days.map(d=>db.timetable.filter(x=>x.day===d).sort((a,b)=>a.time.localeCompare(b.time)).map(x=>`<tr><td>${d}</td><td>${esc(x.time)}</td><td><b>${esc(x.subject)}</b></td><td>${esc(x.detail)}</td><td>${actions('timetable',x.id)}</td></tr>`).join('')).join('')||`<tr><td colspan="5">Chưa có tiết học. Nhấn “Thêm tiết học” để bắt đầu nhé!</td></tr>`}</tbody></table></div>`)}`}
function notes(){return `<div class="section-head"><div><h2>📝 Sổ ghi chú</h2><p class="muted">Lưu kiến thức theo từng môn học.</p></div>${btn('+ Ghi chú mới',`add('notes')`)}</div><div class="grid">${db.notes.map(n=>`<div class="card"><span class="tag">${esc(n.subject)}</span><h3>${esc(n.title)}</h3><p class="muted">${esc(n.body)}</p><p class="muted">Cập nhật: ${fmt(n.updated)}</p>${actions('notes',n.id)}</div>`).join('')||empty('Chưa có ghi chú nào. Hãy lưu kiến thức đầu tiên!')}</div>`}
function tasks(){return `<div class="section-head"><div><h2>📚 Quản lý bài tập</h2><p class="muted">Theo dõi bài cần làm và hạn hoàn thành.</p></div>${btn('+ Thêm bài tập',`add('tasks')`)}</div>${card('Danh sách bài tập',db.tasks.map(t=>`<div class="item"><div><h3>${esc(t.title)}</h3><p>${esc(t.subject)} · Hạn: ${fmt(t.due)} · ${esc(t.status)}</p><p>${esc(t.detail)}</p></div><div class="actions">${btn(t.status==='Hoàn thành'?'Bỏ xong':'Đánh dấu xong',`toggleTask('${t.id}')`,'tiny')}${actions('tasks',t.id)}</div></div>`).join('')||empty('Bạn chưa thêm bài tập nào!'))}` }
function exams(){return `<div class="section-head"><div><h2>⏰ Lịch kiểm tra</h2><p class="muted">Ghi lại ngày thi để chuẩn bị sớm.</p></div>${btn('+ Thêm lịch',`add('exams')`)}</div>${card('Các bài kiểm tra',db.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="item"><div><h3>${esc(x.title)}</h3><p>${esc(x.subject)} · ${fmt(x.date)} ${esc(x.time)}</p><p>${esc(x.detail)}</p></div>${actions('exams',x.id)}</div>`).join('')||empty('Chưa có lịch kiểm tra nào.') )}` }
function pomodoro(){return `<div class="section-head"><div><h2>🍅 Pomodoro</h2><p class="muted">Tập trung từng khoảng thời gian ngắn.</p></div></div><section class="card timer"><span class="tag" id="timerMode">${mode==='study'?'Thời gian tập trung':'Thời gian nghỉ'}</span><div class="timer-display" id="timerDisplay">${clock(remaining)}</div><div class="timer-controls">${btn('Bắt đầu','startTimer()','primary')} ${btn('Tạm dừng','pauseTimer()')} ${btn('Đặt lại','resetTimer()')}</div><div style="margin-top:18px" class="actions" style="justify-content:center">${btn('25 phút học',"setMode('study')")} ${btn('5 phút nghỉ',"setMode('break')")}</div><p class="muted">Mẹo nhỏ: Tắt thông báo và tập trung vào một việc nhé ♡</p></section>`}
function clock(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function startTimer(){if(timer)return;timer=setInterval(()=>{remaining--;const el=document.getElementById('timerDisplay');if(el)el.textContent=clock(remaining);if(remaining<=0){pauseTimer();toast(mode==='study'?'Hoàn thành phiên học! Đến giờ nghỉ rồi ♡':'Hết giờ nghỉ, quay lại học nhé!');}},1000)}
function pauseTimer(){if(timer){clearInterval(timer);timer=null}}
function resetTimer(){pauseTimer();remaining=mode==='study'?1500:300;render()}
function setMode(m){pauseTimer();mode=m;remaining=m==='study'?1500:300;render()}
function goals(){return `<div class="section-head"><div><h2>🌱 Mục tiêu học tập</h2><p class="muted">Chia mục tiêu lớn thành những bước nhỏ.</p></div>${btn('+ Thêm mục tiêu',`add('goals')`)}</div><div class="grid">${db.goals.map(g=>{let p=Math.min(100,Math.round((Number(g.done)||0)/(Number(g.target)||1)*100));return `<div class="card"><h3>${esc(g.title)}</h3><p class="muted">${g.done||0}/${g.target||1} · Hạn ${fmt(g.due)}</p><div class="progress"><span style="width:${p}%"></span></div><b style="color:#b15d80">${p}% hoàn thành</b>${actions('goals',g.id)}</div>`}).join('')||empty('Thêm mục tiêu đầu tiên nhé!')}</div>`}
function resources(){return `<div class="section-head"><div><h2>📎 Tài liệu học tập</h2><p class="muted">Lưu đường dẫn tài liệu hữu ích.</p></div>${btn('+ Thêm tài liệu',`add('resources')`)}</div>${card('Kho tài liệu',db.resources.map(r=>`<div class="item"><div><h3>${esc(r.title)} <span class="tag">${esc(r.subject)}</span></h3><p>${esc(r.detail)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener">Mở tài liệu ↗</a></div>${actions('resources',r.id)}</div>`).join('')||empty('Chưa lưu tài liệu nào.') )}` }
function grades(){const subjects=[...new Set(db.grades.map(x=>x.subject))];return `<div class="section-head"><div><h2>💗 Tính điểm trung bình</h2><p class="muted">Nhập điểm và hệ số để tính trung bình có trọng số.</p></div>${btn('+ Thêm điểm',`add('grades')`)}</div>${subjects.map(s=>{let arr=db.grades.filter(x=>x.subject===s),sum=arr.reduce((a,x)=>a+x.score*x.weight,0),w=arr.reduce((a,x)=>a+x.weight,0),avg=w?sum/w:0;return `<div class="card" style="margin-bottom:12px"><div class="section-head"><h2>${esc(s)}</h2><span class="score">${avg.toFixed(2)}</span></div>${arr.map(x=>`<div class="item"><div><b>${esc(x.label)}</b><p>${x.score} điểm · Hệ số ${x.weight}</p></div>${actions('grades',x.id)}</div>`).join('')}<p class="muted">Điểm trung bình tạm tính: ${avg.toFixed(2)} / 10</p></div>`}).join('')||empty('Thêm điểm các môn để tính trung bình nhé!')}<p class="muted">Lưu ý: Đây là điểm trung bình theo các hệ số bạn nhập, có thể khác cách tính chính thức của trường.</p>`}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;pauseTimer();render()}});
render();
</script>
</body>
</html>
